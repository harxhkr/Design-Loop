<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop</title>
<style>
:root{--lime:#CEF53A;--cream:#FAF7F0;--card:#FEFDFB;--line:#d6d3cc;--ink:#000;--mute:#777;--blue:#0a66e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--cream)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--cream);box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:3}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.dot{width:28px;height:28px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:800;font-size:15px}
.hr{display:flex;align-items:center;gap:18px}
.av{width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;border:0;font-size:20px;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px 16px 110px}
main.nonav{padding-bottom:24px}
h1{font-size:26px;font-weight:700}h2{font-size:22px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0}
input:focus,textarea:focus{border-color:#9bbf1a}
input,textarea{color:#000;-webkit-text-fill-color:#000;opacity:1}input::placeholder,textarea::placeholder{color:#8a8a8a;-webkit-text-fill-color:#8a8a8a}
textarea{min-height:110px;resize:none;border-radius:10px}
.btn{width:100%;background:var(--lime);border:1px solid #a6c92a;border-radius:12px;padding:13px;font-weight:700;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,.2);margin-top:16px}
.pill{display:inline-block;background:var(--lime);border-radius:20px;padding:5px 14px;font-weight:600;font-size:14px;border:0}
.pill.blue{background:var(--blue);color:#fff}
nav{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:40px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;padding:6px;z-index:4}
nav button{flex:1;border:0;background:none;border-radius:34px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
nav button span{font-size:20px;line-height:1.1}
nav button.on{background:var(--lime)}
.search{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin:14px 0}
.search input{border:0;padding:13px 0;background:none}
.chips{display:flex;gap:10px;margin-bottom:16px;overflow-x:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 20px;font-size:16px}
.chip.on{background:#000;color:#fff;border-color:#000;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.sec button{background:none;border:0;font-size:16px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;cursor:grab;scrollbar-width:none;-webkit-overflow-scrolling:touch;user-select:none}
.row::-webkit-scrollbar{display:none}.row.drag{cursor:grabbing}
.row.grid{flex-wrap:wrap;overflow:visible}.row.grid .it{flex:0 0 calc(50% - 6px)}
.it{flex:0 0 155px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding-bottom:12px}
.img{height:105px;display:grid;place-items:center;font-size:44px;background-size:cover;background-position:center}
.it h4{font-size:16px;font-weight:600;margin:10px 12px 4px}.it p{margin:0 12px 10px;color:#222}
.it .f{display:flex;justify-content:space-between;align-items:center;margin:0 12px}
.back{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big{height:230px;background-color:#fff;border-radius:6px;margin-bottom:0;display:grid;place-items:center;background-size:cover;background-position:center}
.thread{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;width:100%;text-align:left}
.thread .dot{width:36px;height:36px}
.thread b{display:block}.thread small{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:240px}
.tabs{display:flex;gap:14px;margin:14px 0 20px}.tabs button{flex:1;background:var(--lime);border:0;border-radius:14px;padding:12px;font-size:16px;opacity:.7}.tabs button.on{opacity:1;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#chat{display:flex;flex-direction:column;height:100%}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 16px 12px}
.big-av{width:132px;height:132px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:54px;margin:20px auto 24px;box-shadow:0 0 50px 20px rgba(206,245,58,.5);flex:none}
.m{max-width:75%;padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:16px;width:fit-content}.m.me{align-self:flex-end}
.m img{max-width:200px;border-radius:10px;display:block}
.bar{display:flex;gap:10px;padding:12px 16px;align-items:center;position:relative}
.bar input{border-radius:30px;background:#fff;flex:1}
.circ{width:44px;height:44px;border-radius:50%;background:var(--lime);border:0;font-size:20px;flex:none}
.pop{position:absolute;right:16px;bottom:70px;background:var(--lime);border-radius:14px;padding:14px 18px;display:none;flex-direction:column;gap:16px}.pop.on{display:flex}
.pop button{background:none;border:0;text-align:left;font-size:16px}
.prof{background:var(--card);margin:-16px -16px 0;padding:16px;position:relative}
.pav{width:96px;height:96px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;box-shadow:0 0 0 8px rgba(206,245,58,.35)}
.ver{display:inline-block;background:#dbeafe;color:var(--blue);font-weight:600;border-radius:20px;padding:6px 14px;margin:14px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--lime);border-radius:14px;margin:18px 0 0;overflow:hidden;gap:1px}.stats div{padding:16px;background:var(--lime);outline:1px solid rgba(255,255,255,.6)}.stats b{font-size:28px;display:block;font-weight:500}
.badge{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 16px;margin-bottom:12px;font-weight:600}
.steps{display:flex;gap:10px;margin:10px 0 18px}.steps i{flex:1;height:4px;border-radius:2px;background:#d4d4d4}.steps i.on{background:var(--lime)}
.opt{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:22px 8px;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:8px}.opt.on{background:var(--lime);border-color:#8fb013}.opt span{font-size:22px}
.nv{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.nv .back2{background:none;border:0;color:var(--mute);font-size:17px}.nv .btn{width:auto;margin:0;padding:12px 28px;font-size:16px}
.drop{border:2px dashed var(--line);border-radius:6px;background:var(--cream);height:170px;display:grid;place-items:center;font-size:36px;color:#888;margin-top:12px;overflow:hidden;cursor:pointer}.drop img,.prev{width:100%;height:100%;object-fit:cover}
.note{text-align:center;color:#222;margin:16px 0}
.chk{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;width:100%;font-size:16px}.chk i{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;display:grid;place-items:center;color:#000}.chk.on i{background:var(--lime)}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px 56px;gap:24px}.okc{width:100px;height:100px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:48px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.pop button{display:flex;align-items:center;gap:14px}.ver{display:inline-flex;align-items:center;gap:8px}.circ{display:grid;place-items:center;padding:0}.drop{color:#888}
.hh{font-size:26px;font-weight:700;color:#151a2c;margin-top:6px}.hs{color:#7a86a8;font-size:17px;line-height:1.5;margin:16px 0 0}.sq2{border-radius:6px;margin:22px 0 30px}
.lab{color:#6b7a99;font-size:12px;letter-spacing:.06em;font-weight:500;margin-bottom:8px}.lrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px}
.lh{font-size:25px;line-height:1.28;color:#151a2c;max-width:215px}.sl{background:none;border:0;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;padding:0 0 4px;white-space:nowrap}
.lcard{overflow:hidden;border-radius:0 0 18px 18px}.lcard img{display:block;width:100%}.lp{background:var(--lime);padding:22px 20px 28px}
.lab2{font-size:12px;font-weight:600;letter-spacing:.04em}.lp h2{font-size:30px;line-height:1.2;margin:12px 0 18px;color:#151a2c}.lp p{font-size:16px;line-height:1.4;margin-bottom:24px}
.pi{background:none;border:0;font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px;padding:0}
</style></head><body><div id="app"></div><div class="toast" id="t"></div>

 if(sc=='profile'){const n=S.items.filter(i=>i.mine).length;body=`<div class="prof"><div style="display:flex;justify-content:space-between"><div class="pav">${S.user.ini}</div><button style="background:none;border:0;height:30px" onclick="if(confirm('Log out?')){S.scr='login';render()}">${ic('gear',26)}</button></div><h1 style="margin-top:20px;font-size:25px">${S.user.name}</h1><div class="ver">${ic('shield',18)} Verified Student</div><p>Fashion - K.R. Mangalam University</p><div class="stats"><div><b>${7+n}</b>Resources Shared</div><div><b>3</b>Exchanges</div><div><b>4.6</b>rating</div><div><b>7</b>Projects supported</div></div></div><h2 style="margin:28px 0 16px;font-size:21px">Loop Badges</h2><div class="badge"><span style="color:#f26a21;display:flex">${ic('award',24)}</span>Material Saver</div><div class="badge"><span style="color:#f26a21;display:flex">${ic('star',24)}</span>Campus Helper</div>`}
 if(sc=='share'){const d=S.draft,st=d.step;const steps=`<h1 style="margin-bottom:12px">Share a resource</h1><div class="steps">${[1,2,3,4].map(k=>`<i class="${k<=st?'on':''}"></i>`).join('')}</div>`;let c='';
  if(st==1)c=`<h2 style="font-size:21px">What are you sharing?</h2><div class="g2" style="margin-top:20px">${[['Material','mat'],['Tool','tool'],['Craft','craft'],['Other','other']].map(([k,i])=>`<button class="opt ${d.t==k?'on':''}" onclick="S.draft.t='${k}';render()"><span>${ic(i,26)}</span>${k}</button>`).join('')}</div><button class="chk ${d.left?'on':''}" onclick="S.draft.left=!S.draft.left;render()">Is this leftover from a project?<i>${d.left?ic('check',18,3):''}</i></button>`;
  if(st==2)c=`<h2 style="font-size:21px">What are you sharing?</h2><div class="drop" onclick="$('#pf').click()">${d.img?`<img src="${d.img}">`:ic('imgplus',44)}</div><input type="file" id="pf" accept="image/*" hidden onchange="pickImg(this,0)"><p class="note">Natural light and simple background help students understand condition and texture.</p>`;
  if(st==3)c=`<h2 style="font-size:21px">A few useful details</h2><label>Name</label><input id="dn" value="${d.name}" placeholder="e.g. 3mm transparent acrylic"><div class="g2"><div><label>Quantity</label><input id="dq" value="${d.qty}" placeholder="2 sheets"></div><div><label>Price</label><input id="dp" inputmode="numeric" value="${d.price}" placeholder="250"></div><div><label>Condition</label><input id="dc" value="${d.cond}" placeholder="Perfect"></div><div><label>Date</label><input id="dd" value="${d.date||new Date().toLocaleDateString('en-GB',{day:'numeric',month:'numeric',year:'2-digit'})}"></div></div><label>Location</label><input id="dl" value="${d.loc}" placeholder="Campus"><label>Anything else?</label><textarea id="dx">${d.desc}</textarea>`;
  if(st==4)c=`<h2 style="font-size:21px">What are you sharing?</h2><div class="g2" style="margin-top:20px">${['Sell','Exchange','Give away','Rent'].map(k=>`<button class="opt ${d.mode==k?'on':''}" style="padding:36px 8px" onclick="S.draft.mode='${k}';render()">${k}</button>`).join('')}</div>`;
  body=steps+`<div class="card">${c}<div class="nv"><button class="back2" onclick="step(-1)">&lt; Back</button><button class="btn" onclick="step(1)">${st==4?'Publish':'Continue'} &gt;</button></div></div>`}
 if(sc=='done'){body=`<div class="card ok"><div class="okc">${ic('check',56,2.4)}</div><h2 style="font-size:24px;line-height:1.25">Listed.<br>The Loop is open.</h2><p>Students near your campus can now discover your ${S.last}.</p></div>`}
 A.innerHTML=head()+`<main class="${nonav?'nonav':''}">${body}</main>`+navb();
 if(sc=='feed')feedRows();
}
function feedRows(){
 const f=S.f,q=S.q.toLowerCase(),vis=i=>(f=='All'||(f=='Buy'&&i.m=='Sell')||(f=='Rent'&&i.m=='Rent')||(f=='Borrow'&&(i.m=='Give away'||i.m=='Exchange')))&&(!q||(i.n+i.c+i.desc).toLowerCase().includes(q));
 const cats=['Craft Supplies','Tools','Other'];let h='';
 cats.forEach(c=>{const l=S.items.filter(i=>i.c==c&&vis(i));if(!l.length)return;const o=S.open[c];
  h+=`<div class="sec"><h2>${c}</h2><button onclick="S.open['${c}']=!S.open['${c}'];feedRows()">${o?'Show less':'See all'} ${ic('arrow',20)}</button></div><div class="row ${o?'grid':''}">${l.map(i=>`<div class="it" onclick="if(!window.moved){S.sel=S.items.find(x=>x.id==${i.id});go('detail')}">${pic(i,'img')}<h4>${i.n}</h4><p>₹ ${i.p}</p><div class="f"><span class="pill">${tag(i.m)}</span><span>${ic('arrow',20)}</span></div></div>`).join('')}</div>`});
 $('#rows').innerHTML=h||'<p class="note" style="color:var(--mute)">No resources found</p>';
 document.querySelectorAll('.row').forEach(r=>{let d=0,x=0,s=0;r.onpointerdown=e=>{if(e.pointerType!='mouse')return;d=1;x=e.clientX;s=r.scrollLeft;window.moved=false};
  r.onpointermove=e=>{if(!d)return;const dx=e.clientX-x;if(Math.abs(dx)>4){window.moved=true;r.classList.add('drag')}r.scrollLeft=s-dx};
  const u=()=>{d=0;r.classList.remove('drag');setTimeout(()=>window.moved=false,50)};r.onpointerup=r.onpointerleave=u});
}
function otp(){const n=$('#ln').value.trim(),p=$('#lp').value.trim(),e=$('#le').value.trim(),b=$('#lb');
 if(!S.sent){if(!n||!/^\d{10}$/.test(p)||!e)return toast('Enter name, 10-digit phone & school email');if(!/^[^\s@]+@krmu\.edu\.in$/i.test(e))return toast('Use your school email ending with @krmu.edu.in');S.sent=1;S.pend={n,p,e};b.textContent='Verify & Continue';toast('OTP sent (demo: any 4 digits)');return}
 if(!/^\d{4}$/.test($('#lo').value))return toast('Enter the 4-digit OTP');
 const w=S.pend.n.split(/\s+/);S.user={name:S.pend.n,first:w[0],ini:(w[0][0]+(w[1]||'')[0]).toUpperCase()};S.sent=0;S.tab='home';S.scr='home';render()}
function textStudent(){const n=S.sel.s;if(S.sel.mine||!n)return toast('This is your own listing');if(!S.th[n])S.th[n]={m:[]};S.chat=n;go('chat')}
function send(){const i=$('#mi'),v=i.value.trim();if(!v)return;S.th[S.chat].m.push(['me',v]);render();setTimeout(()=>{S.th[S.chat].m.push(['them','Thanks! I’ll get back to you shortly.']);if(S.scr=='chat')render()},1200)}
function loc(){$('#pop').classList.remove('on');if(!navigator.geolocation)return toast('Location not supported');navigator.geolocation.getCurrentPosition(p=>{S.th[S.chat].m.push(['me','📍 Live location: https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude]);render()},()=>toast('Location permission denied'))}
function pickImg(el,w){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(w){S.th[S.chat].m.push(['me','',r.result])}else S.draft.img=r.result;render()};r.readAsDataURL(f)}
function step(n){const d=S.draft;
 if(d.step==3){d.name=$('#dn').value;d.qty=$('#dq').value;d.price=$('#dp').value;d.cond=$('#dc').value;d.date=$('#dd').value;d.loc=$('#dl').value;d.desc=$('#dx').value;if(n>0&&(!d.name.trim()||!d.price))return toast('Add a name and price')}
 if(d.step==1&&n<0){return nav('home')}
 if(d.step==4&&n>0){const id=Date.now();S.items.unshift({id,n:d.name,p:+d.price||0,m:d.mode,c:({Material:'Craft Supplies',Tool:'Tools',Craft:'Craft Supplies',Other:'Other'})[d.t],im:'acrylic',e:d.img?'':'📦',photo:d.img,q:d.qty||'1',cond:d.cond||'Good',loc:d.loc||'Campus',d:d.date,desc:d.desc||'—',mine:1});S.last=d.name.toLowerCase();S.draft={t:'Material',left:false,img:null,name:'',qty:'',price:'',cond:'',date:'',loc:'',desc:'',mode:'Sell',step:1};S.tab='explore';return go('done')}
 d.step+=n;render()}
render();
</script></body></html>
